version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-redflag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redflag}
      POSTGRES_DB: ${POSTGRES_DB:-redflag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  simulation-engine:
    build: ./simulation-engine
    restart: unless-stopped
    env_file: .env
    ports:
      - "4000:4000" # admin API — keep private; do NOT tunnel this
      - "4001:4001" # public surface (click tracking only) — the tunnel targets this
    depends_on:
      - postgres
    volumes:
      - ./simulation-engine:/app
      - /app/node_modules

  risk-model:
    build: ./risk-model
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./risk-model:/app

  # Official pre-built image — the vendored ./gophish directory ships only
  # static assets/migrations/config, not buildable Go source.
  gophish:
    image: gophish/gophish:latest
    restart: unless-stopped
    # Run as root so Gophish can create its DB in the (root-owned) named volume
    # on a fresh clone without a manual chown. Local demo only.
    user: root
    ports:
      - "33330:3333" # host port shifted — 3333 falls in Windows' reserved dynamic port range
      - "8080:8080"
    volumes:
      - ./docker/gophish/config.json:/opt/gophish/config.json
      # Persist gophish.db so the admin password, API key and campaigns survive
      # container recreates (config.json points db_path at data/).
      - gophish_data:/opt/gophish/data

  portal:
    build: ./portal
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - simulation-engine

volumes:
  postgres_data:
  gophish_data:
