server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker DNS, so nginx still starts (and recovers) when the engine restarts.
  resolver 127.0.0.11 valid=10s;

  # SPA fallback: deep links (/login, emailed reset/invite links) load the app.
  # Always revalidate the HTML so a new build shows at once (assets are hashed).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # A missing build file is a 404, never the app HTML (which renders blank).
  location /assets/ {
    try_files $uri =404;
  }

  # Gophish posts its webhook over the Docker network, never through here (any case).
  location ~* ^/api/campaigns/webhook {
    return 404;
  }

  # Same-origin API, used when the portal is hosted publicly.
  location /api/ {
    set $engine http://simulation-engine:4000;
    proxy_pass $engine;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 1m;
    # Live updates are a long-lived stream.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
