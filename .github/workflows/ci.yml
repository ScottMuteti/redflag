name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  node:
    name: simulation-engine + portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build --workspace=portal

  risk-model:
    name: risk-model
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: risk-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: risk-model/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8 .
      - run: pytest
