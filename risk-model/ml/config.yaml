# Baseline experiment configuration for the RedFlag susceptibility model.
# Everything the run depends on lives here so a run is reproducible from it.
seed: 42

data:
  # SYNTHETIC persona-based employees. No real people. See data_generation.py.
  n_employees: 400
  n_campaigns: 6 # simulated attacks per employee, in time order
  training_intervention_after: 3 # campaign index after which some employees train
  missing_tenure_fraction: 0.05 # left blank so KNN imputation has real work

split:
  test_size: 0.2
  n_folds: 5

# Grid searched inside the CV folds only (never touching the held-out set).
grid:
  classifier__C: [0.1, 1.0, 10.0]
  classifier__penalty: ["l2"]
  classifier__class_weight: [null, "balanced"]

target_auc_roc: 0.85
